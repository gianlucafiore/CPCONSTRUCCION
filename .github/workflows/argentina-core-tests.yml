name: CPconstruccion core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  argentina-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest werkzeug
      - name: Compile Python sources
        run: python -m compileall -q core views tests main.py
      - name: Run economic engine tests
        run: |
          python -m pytest -q \
            tests/test_indices_genericos.py \
            tests/test_indices_csv.py \
            tests/test_certificados_contratos.py \
            tests/test_codigo_recurso_argentina.py \
            tests/test_plantillas_argentina.py \
            tests/test_certificados_comitente_registro.py \
            tests/test_certificados_comitente_pdf.py
